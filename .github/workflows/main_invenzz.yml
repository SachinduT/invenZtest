name: Build and deploy React app to Azure Web App - invenzapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install dependencies
        working-directory: ./invenZ
        run: npm install

      - name: Build React application
        working-directory: ./invenZ
        run: npm run build

      - name: Run tests
        working-directory: ./invenZ
        run: npm run test --if-present

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./invenZ/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "invenzapp"
          slot-name: "Production"
          package: ./app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3EF697DEF40C4B05BAA9E533AD5C43FA }}
